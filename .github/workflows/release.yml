# A tag v<x.y.z>: build the ad-hoc signed app, zip it, and attach it and its checksum to a GitHub release (PLAN_PUBLIC_RELEASE P5).
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Checks
        run: scripts/ci-checks.sh
      - name: Build and zip
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cat > notes.md <<NOTES
          Download **Distraction-Bot-$v.zip**, unzip it, and drag the app into Applications.
          The app is signed ad-hoc, not notarized: the first time, open **System Settings → Privacy & Security** and click **Open Anyway**.
          The full guide, including the local judge (Ollama), is [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/$GITHUB_REF_NAME/INSTALL.md).

          Apple silicon, macOS 15 or later. Checksum in SHA256SUMS.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/release/Distraction-Bot-$v.zip dist/release/SHA256SUMS \
            --title "Distraction Bot $v" --notes-file notes.md
