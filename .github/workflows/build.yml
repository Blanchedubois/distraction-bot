# Every push and pull request: the release build and the headless checks (PLAN_PUBLIC_RELEASE P5, §3.7).
name: build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - name: Release build
        run: swift build -c release
      - name: Checks
        run: scripts/ci-checks.sh
